<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in - Community Resource Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600;6..72,700;6..72,800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f4f1e8; --card: #faf8f0; --ink: #1d1b16; --ink-soft: #5f594a;
  --line: #cfc7b0; --coral: #96351e;
  --red-ink: #8f2f1c; --red-soft: #f0ded6;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  font-family: "Public Sans", sans-serif; color: var(--ink);
  background: var(--paper); font-size: 15px;
}
.card {
  width: min(400px, calc(100vw - 32px));
  background: var(--card); border: 2px solid var(--ink);
  padding: 30px 30px 26px;
}
.brand { font-family: "Newsreader", Georgia, serif; font-weight: 700; font-size: 20px; margin-bottom: 4px; }
.brand .mark { color: var(--coral); margin-right: 7px; }
p.sub { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 20px; }
label { display: block; font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
  font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }
input[type=password] {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink);
  border: 1px solid var(--ink-soft); padding: 11px 12px;
  background: var(--paper); margin-bottom: 14px;
}
input[type=password]:focus { outline: 2px solid var(--coral); outline-offset: 1px; }
button {
  width: 100%; font-family: "Public Sans", sans-serif; font-weight: 700;
  font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
  background: var(--ink); color: var(--paper); border: none;
  padding: 13px; cursor: pointer;
}
button:hover { background: #000; }
:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
.error {
  background: var(--red-soft); color: var(--red-ink); border: 1px solid var(--red-ink);
  padding: 9px 12px; font-size: 13.5px; margin-bottom: 14px;
}
p.hint { color: var(--ink-soft); font-size: 12.5px; margin: 16px 0 0; }
</style>
</head>
<body>
  <form class="card" method="post">
    <div class="brand"><span class="mark">&#10037;</span>Community Resource <b>Navigator</b></div>
    <p class="sub">Staff sign-in. Enter the shared team password.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="password">Team password</label>
    <input type="password" id="password" name="password" autofocus autocomplete="current-password">
    <button type="submit">Sign in</button>
    <p class="hint">You&rsquo;ll stay signed in on this browser for 30 days.
      Ask your coordinator if you don&rsquo;t know the password.</p>
  </form>
</body>
</html>
