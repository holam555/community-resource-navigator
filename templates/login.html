<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in - Community Resource Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:ital,wght@0,400;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #fbf4e3; --card: #fffcf3; --ink: #3a2c1c; --ink-soft: #7c6a52;
  --line: #e4d7bb; --spruce: #37573f; --spruce-deep: #274430;
  --coral: #bc5127; --red-ink: #a03d20; --red-soft: #f5ded4;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  font-family: "Karla", sans-serif; color: var(--ink);
  background:
    radial-gradient(700px 320px at 85% -8%, rgba(233,163,59,.15), transparent 60%),
    var(--paper);
  font-size: 15.5px;
}
.card {
  width: min(400px, calc(100vw - 32px));
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 2px 0 rgba(58,44,28,.05), 0 16px 36px -16px rgba(120,85,40,.4);
  padding: 30px 30px 26px;
}
.brand {
  font-family: "Young Serif", Georgia, serif; font-size: 18px; margin-bottom: 6px;
  display: flex; align-items: center; gap: 10px;
}
.brand svg { width: 36px; height: 36px; flex: none; }
.brand b { font-weight: 400; color: var(--spruce-deep); }
p.sub { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 20px; }
label { display: block; font-size: 11.5px; font-weight: 800; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }
input[type=password] {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 13px;
  background: #fffef9; margin-bottom: 14px;
}
input[type=password]:focus { outline: 2.5px solid var(--coral); outline-offset: 1px; }
button {
  width: 100%; font-family: "Karla", sans-serif; font-weight: 800; font-size: 15px;
  background: var(--spruce); color: #fff; border: none; border-radius: 999px;
  padding: 13px; cursor: pointer;
}
button:hover { background: var(--spruce-deep); }
:focus-visible { outline: 2.5px solid var(--coral); outline-offset: 2px; }
.error {
  background: var(--red-soft); color: var(--red-ink); border-radius: 10px;
  padding: 9px 12px; font-size: 13.5px; margin-bottom: 14px;
}
p.hint { color: var(--ink-soft); font-size: 12.5px; margin: 16px 0 0; }
</style>
</head>
<body>
  <form class="card" method="post">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <g stroke="#bc5127" stroke-width="2.6" stroke-linecap="round">
          <line x1="24" y1="4" x2="24" y2="9"/>
          <line x1="34.5" y1="8.5" x2="31.4" y2="12.2"/>
          <line x1="13.5" y1="8.5" x2="16.6" y2="12.2"/>
          <line x1="40" y1="19" x2="35.4" y2="19.6"/>
          <line x1="8" y1="19" x2="12.6" y2="19.6"/>
        </g>
        <circle cx="24" cy="20" r="7.2" fill="#e9a33b" stroke="#3a2c1c" stroke-width="2.4"/>
        <path d="M7 41 l8.5 -9 8.5 9" fill="none" stroke="#37573f" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M24.5 41 l8.5 -9 8.5 9" fill="none" stroke="#37573f" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
        <line x1="4.5" y1="41" x2="43.5" y2="41" stroke="#3a2c1c" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      Community Resource <b>Navigator</b>
    </div>
    <p class="sub">Staff sign-in. Enter the shared team password.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="password">Team password</label>
    <input type="password" id="password" name="password" autofocus autocomplete="current-password">
    <button type="submit">Sign in</button>
    <p class="hint">You&rsquo;ll stay signed in on this browser for 30 days.
      Ask your coordinator if you don&rsquo;t know the password.</p>
  </form>
</body>
</html>
